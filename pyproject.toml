[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xdesk"
version = "0.1.0"
description = "Read-only X desk CLI for @spicefiendd. GET-only. Never posts, likes, follows, or DMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.6",
]

[project.scripts]
xdesk = "xdesk.cli:main"

[tool.setuptools.packages.find]
include = ["xdesk", "xdesk.*"]

[tool.setuptools.package-data]
"xdesk.lib" = ["endpoints.json", "features.json", "account.local.json.example"]
